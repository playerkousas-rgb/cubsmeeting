<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6A1B9A">
<title>🐺 幼童軍團集會助手 Cub Hub</title>
<meta name="description" content="取代官方《幼童軍團集會套包》：新領袖淨係用呢個APP就帶得完一場集會。開季規劃、執集會、投影帶領、事後追蹤一條龍。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="netbar" style="display:none">📴 而家離線：套包照帶到；兩個相關APP要上網先用得，掣已變灰。</div>
<div id="app">
  <div id="stickytop">
    <header id="topbar">
      <div class="brand" onclick="location.hash='#plan'">🐺 幼童軍團集會助手</div>
      <div class="topbtns">
        <button class="iconbtn" onclick="location.hash='#lead'" title="隨手開會：即刻帶">⚡</button>
        <button class="iconbtn" onclick="location.hash='#book'" title="手冊＋設定">⚙️</button>
      </div>
    </header>
    <!-- 上：新手快速入口（最多4粒，純入口，唔係流程，唔標一二三四） -->
    <nav id="topnav" aria-label="新手快速入口">
      <div class="navcap a">🅰️ 新手快速入口</div>
      <div class="navrow">
        <a href="#plan" data-tab="plan"><span>📅</span>揀集會</a>
        <a href="#pack" data-tab="pack"><span>🖨️</span>印教材</a>
        <a href="#lead" data-tab="lead"><span>▶️</span>帶領</a>
        <a href="#track" data-tab="track"><span>📝</span>記錄</a>
      </div>
    </nav>
  </div>
  <main id="view"></main>
  <!-- 嚮導條：貼底部列之上，預設唔出，揀咗集會＋撳邀請卡先出 -->
  <div id="flowbar"></div>
  <!-- 下：工具箱（最多4粒，老手直接跳，唔係流程） -->
  <nav id="tabbar" aria-label="工具箱">
    <div class="navcap b">🅱️ 工具箱：想要邊樣，直接撳</div>
    <div class="navrow">
      <a href="#pack" data-tab="pack"><span>✂️</span>圖紙</a>
      <a href="#play" data-tab="play"><span>🎮</span>活動</a>
      <a href="#meet" data-tab="meet"><span>🧩</span>範本</a>
      <a href="#book" data-tab="book"><span>📖</span>手冊</a>
    </div>
  </nav>
</div>
<div id="modal"></div>
<script src="js/data.js"></script>
<script src="js/guide.js"></script>
<script src="js/flow.js"></script>
<script src="js/app.js"></script>
<script>
/* 所有嚮導 hook 用 typeof 保護：嚮導未載入都唔影響原有功能 */
if ("serviceWorker" in navigator) { addEventListener("load", function () { try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {} }); }
try {
  if (typeof App !== "undefined" && App.init) App.init();
  else document.getElementById("view").innerHTML = "<p>載入緊…</p>";
} catch (e) { document.getElementById("view").innerHTML = "<p>出錯，重新整理試下。</p>"; }
</script>
</body>
</html>
